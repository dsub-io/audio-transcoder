name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Release Please tag to publish (recovery only)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  PNPM_VERSION: 11.9.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Verify release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${RELEASE_GITHUB_TOKEN}" ]; then
            echo "::error title=Missing Release Please token::Set secrets.GH_TOKEN. The organization policy does not allow github.token to create release pull requests."
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the exact release
        run: pnpm check

      - name: Build the release codec package
        run: pnpm codec-assets:release

      - name: Publish the codec package with npm OIDC
        run: |
          version=$(node --print "require('./package.json').version")
          if [ "$(npm view "@dsub/audio-transcoder-codecs@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "@dsub/audio-transcoder-codecs@${version} is already published."
          else
            npm publish ./.artifacts/codec-assets-package --access public
          fi

      - name: Wait for the exact jsDelivr codec assets
        run: |
          for attempt in $(seq 1 24); do
            if node ./scripts/verify-published-codec-assets.mjs; then
              exit 0
            fi
            if [ "${attempt}" -eq 24 ]; then
              echo "The exact codec package did not become available on jsDelivr." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Publish the engine package with npm OIDC
        run: |
          version=$(node --print "require('./package.json').version")
          if [ "$(npm view "@dsub/audio-transcoder@${version}" version 2>/dev/null || true)" = "${version}" ]; then
            echo "@dsub/audio-transcoder@${version} is already published."
          else
            npm publish --access public
          fi
