name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify release token
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${RELEASE_GITHUB_TOKEN}" ]; then
            echo "::error title=Missing Release Please token::Set secrets.GH_TOKEN. The organization policy does not allow github.token to create release pull requests."
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
